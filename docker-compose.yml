# Settings both backend services read. Each service adds only the ones it uses: the API
# never sees HF_TOKEN or the pipeline parameters.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DATA_DIR: ${DATA_DIR:-/data}
  MODELS_DIR: ${MODELS_DIR:-/models}
  ASR_MODEL: ${ASR_MODEL:-v3_e2e_rnnt}
  DEVICE: ${DEVICE:-cpu}
  PDF_FONT_PATH: ${PDF_FONT_PATH:-}

# Docker keeps container logs forever by default, and the UI polls /health every few
# seconds while it is open.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4-alpine
    # AOF on: job state and worker registry must survive a container restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [internal]
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-env
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      ALLOWED_EXTENSIONS: ${ALLOWED_EXTENSIONS:-wav,mp3,m4a,mp4,webm,ogg}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/data
      - ./models:/models
    ports:
      # Loopback only unless BIND_ADDRESS says otherwise: the API has no authentication,
      # and anyone who can reach it can download every transcript (T13.2).
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/srv/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # `default` for the published port, `internal` to reach Redis.
    networks: [default, internal]
    logging: *logging
    restart: unless-stopped

  # One-shot: downloads the model weights the worker is missing, then exits (T13.5). The
  # worker itself has no internet access. With the weights on disk it is done in a second.
  models:
    build:
      context: ./backend
      target: worker
    command: ["python", "-m", "worker.fetch_models"]
    environment:
      <<: *backend-env
      # Downloading needs no GPU, and under the CUDA override this service gets none.
      DEVICE: cpu
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./models:/models
    logging: *logging

  worker:
    build:
      context: ./backend
      # Separate target: torch and pyannote are installed only here, not into the API image.
      target: worker
    environment:
      <<: *backend-env
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-}
      MAX_ASR_CHUNK_SECONDS: ${MAX_ASR_CHUNK_SECONDS:-20}
      MERGE_SILENCE_GAP_MS: ${MERGE_SILENCE_GAP_MS:-400}
      ASR_BATCH_SIZE: ${ASR_BATCH_SIZE:-8}
      SPEAKER_MATCH_TOLERANCE_MS: ${SPEAKER_MATCH_TOLERANCE_MS:-250}
      BLOCK_SILENCE_GAP_MS: ${BLOCK_SILENCE_GAP_MS:-1500}
      MAX_BLOCK_SECONDS: ${MAX_BLOCK_SECONDS:-40}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/data
      - ./models:/models
    # No route to the internet: whatever the ML libraries try to send cannot leave (T13.5).
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
      # Exits 0 even when a download failed: the worker still starts, and jobs needing the
      # missing model fail with its stable error code.
      models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The worker loads both ML models from disk before it starts accepting jobs.
      start_period: 120s
    logging: *logging
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging
    restart: unless-stopped

networks:
  # No route out of the machine. The worker processes the recordings, and Redis holds the
  # jobs; neither needs the internet once the weights are on disk.
  internal:
    internal: true

volumes:
  redis-data:
