# NVIDIA override. Base compose stays CPU-only and authoritative.
#
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up --build
#
# Requirements: NVIDIA driver + NVIDIA Container Toolkit (Linux) or
# Docker Desktop + WSL2 + NVIDIA driver (Windows).
#
# The worker image installs CPU-only torch on amd64. For real GPU inference the image
# must be rebuilt with CUDA wheels — that is Phase 9 (T9.2). This override already wires
# GPU device access and switches DEVICE to cuda, and the worker fails loudly if CUDA is
# requested but unavailable (no silent CPU fallback).
services:
  worker:
    environment:
      DEVICE: ${DEVICE:-cuda}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
